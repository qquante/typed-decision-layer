name: OMNIA integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['examples/omnia/**', 'tests/test_omnia*', 'docs/omnia/**', 'README.md', '.github/workflows/omnia.yml']
  pull_request:
    paths: ['examples/omnia/**', 'tests/test_omnia*', 'docs/omnia/**', 'README.md', '.github/workflows/omnia.yml']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      USE_TF: '0'
      USE_TORCH: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . ruff==0.16.8
      - run: python -m unittest discover -s tests -p 'test_omnia*.py' -v
      - run: ruff check laya/ examples/omnia/ tests/test_omnia*.py --select=E9,F63,F7,F82,F401,F811 --line-length=120
      - run: python -m compileall -q laya/ tests/ examples/omnia/
      - run: python tests/test_hooks_api.py

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: zensical build --strict --clean
